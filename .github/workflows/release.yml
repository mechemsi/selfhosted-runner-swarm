name: Release

# Runs after CI finishes on main, and only releases what CI proved green.
# semantic-release reads the Conventional Commit titles since the last tag,
# picks the version, bumps the manifests, commits CHANGELOG.md, tags vX.Y.Z and
# creates the GitHub Release. Then the three images are built from the tag,
# scanned, pushed to GHCR and their digests appended to the release notes.
# The host only pulls them. See README "Versioning, deploy and rollback".
#
# Image jobs live here, not in an `on: push: tags` workflow: a tag pushed with
# GITHUB_TOKEN does not start other workflows.
#
# GitHub-hosted only: this repository is public (see ci.yml repo-rules).

on:
  workflow_run:
    workflows: [CI]          # matches ci.yml's `name:`, not its filename
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false  # never cancel a release mid-flight

jobs:
  release:
    name: semantic-release
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # release commit, tag, GitHub Release
      issues: write          # "released in" comments
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0             # needs history to find the last tag
          persist-credentials: false # semantic-release pushes with GITHUB_TOKEN below

      # Release exactly what CI tested. If main has moved on, the newer
      # commit's own CI run releases both, so this run has nothing to do.
      - name: main is still the commit CI tested
        id: guard
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$TESTED" ]; then
            echo "::notice::main is at $head, CI tested $TESTED; the newer run will release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: semantic-release
        id: release
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          before=$(git tag --list 'v*' --sort=-v:refname | head -1)
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/changelog@7.0.0 \
            -p @semantic-release/exec@7.1.0 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
          git fetch --tags --quiet
          after=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "::notice::released $after"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Build and scan without any write token: the scanner is third-party code.
  # The push job below rebuilds from the same GHA cache, so every layer is a
  # cache hit and it ships what was scanned here.
  image-scan:
    name: image-scan (${{ matrix.image }})
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90      # the runner image compiles Python on a cold cache
    strategy:
      fail-fast: true
      matrix:
        image: [orchestrator, dashboard, runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Build context
        id: ctx
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            orchestrator) echo "dir=./orchestrator" >> "$GITHUB_OUTPUT" ;;
            dashboard)    echo "dir=./dashboard" >> "$GITHUB_OUTPUT" ;;
            runner)       echo "dir=./runner-image" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.dir }}
          platforms: linux/amd64
          load: true
          tags: rorch-${{ matrix.image }}:scan
          build-args: RORCH_BUILD_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Advisory, as in ci.yml: the runner image is Ubuntu with a full CI
      # toolchain, so a clean report is unrealistic. Promote to blocking on
      # CRITICAL once the findings are triaged.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          image-ref: rorch-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  image-push:
    name: image-push (${{ matrix.image }})
    needs: [release, image-scan]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write        # GHCR, with GITHUB_TOKEN: no long-lived credential
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [orchestrator, dashboard, runner]
    env:
      REF: ghcr.io/mechemsi/rorch-${{ matrix.image }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Tags and labels
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            orchestrator) dir=./orchestrator ;;
            dashboard)    dir=./dashboard ;;
            runner)       dir=./runner-image ;;
          esac
          sha=$(git rev-parse HEAD)
          {
            echo "dir=$dir"
            echo "tags<<EOF"
            echo "$REF:$VERSION"
            echo "$REF:v$VERSION"
            echo "$REF:${VERSION%.*}"
            echo "$REF:latest"
            echo "$REF:sha-${sha:0:7}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
            echo "org.opencontainers.image.title=rorch-$IMAGE"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$sha"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: push
        with:
          context: ${{ steps.meta.outputs.dir }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RORCH_BUILD_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REF }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p digests
          echo "$REF:$VERSION@$DIGEST" > "digests/$IMAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 7

  # Tags are for humans, digests are for machines: the release notes carry the
  # immutable reference for each image, which is what a pinned deploy or a
  # rollback uses.
  release-notes:
    name: record digests
    needs: [release, image-push]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Append images to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo "### Images"
            echo
            echo "Deploy: \`RORCH_VERSION=$TAG docker compose pull && docker compose up -d\`"
            echo
            echo '```'
            cat digests/orchestrator digests/dashboard digests/runner
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
