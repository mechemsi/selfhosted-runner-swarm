name: Scheduled Audit

# Weekly sweep for things that rot without anyone touching the repo: dependency
# CVEs, and upstream releases of components this repo pins by hand.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check outdated and vulnerable packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/check-deps.sh

  # The runner agent, Node and Python are fetched from upstream release pages,
  # not a package registry, so nothing else notices when they move. This is the
  # watcher for exactly the failure that produced the Node24 incident: the agent
  # went stale, every Node24 action started failing, and CI looked fine.
  runner-agent-watch:
    name: runner-agent-watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned runner agent against the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned=$(grep -oP '^ARG RUNNER_VERSION=\K.*' runner-image/Dockerfile)
          latest=$(gh api repos/actions/runner/releases/latest --jq .tag_name | tr -d v)
          echo "pinned=$pinned latest=$latest"

          if [ "$pinned" = "$latest" ]; then
            echo "Up to date."
            # Rule 2: a finding owns one open issue — close it when it clears.
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label runner-agent --json number --jq '.[].number' \
              | while read -r n; do
                  gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                    --comment "Pinned agent is now $pinned — closing."
                done
            exit 0
          fi

          title="runner: agent $pinned is behind upstream $latest"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label runner-agent --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")

          body=$(cat <<EOF
          \`runner-image/Dockerfile\` pins the GitHub Actions runner agent at **$pinned**.
          The newest upstream release is **$latest**.

          A stale agent silently breaks actions that move to a newer runtime — that is
          how \`shivammathur/setup-php@v2\` started failing with
          \`'using: node24' is not supported\`.

          To update:

          \`\`\`bash
          # bump the ARG default in runner-image/Dockerfile and NEWEST in scripts/build-runner.sh
          make update RUNNER_VERSION=$latest
          \`\`\`

          Pools needing the old agent can pin it with \`runner_image: gh-runner:$pinned\`.
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create runner-agent --color 0e8a16 --force >/dev/null 2>&1 || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --label runner-agent --body "$body"
          fi
