# GitHub Runner Orchestrator — Pool Configuration
# ─────────────────────────────────────────────────
# Each "pool" is an independent group of runners.
# Runners in a pool register at org-level (all repos) or repo-level (one repo).
#
# Pool types:
#   org-level  →  omit "repo" field  →  runners serve ALL repos in that org/account
#   repo-level →  set "repo" field   →  runners serve only that one repo
#
# You can mix and match as many pools as you like.

# Hard ceiling on running containers across ALL pools combined, regardless of
# per-pool max_runners. Size it to what the host can actually handle.
# 0 = unlimited.
max_total_runners: 0

# Backstop: kill any runner container older than this many minutes, whatever its
# state. Reaps leaks the ephemeral-exit and stuck reapers miss — idle runners
# over-provisioned during a burst that never got a job, and jobs that hung after
# coming online. Set it ABOVE your longest expected job or it will abort real
# work. 0 = disabled.
max_runner_lifetime: 0

defaults:
  runner_image:  gh-runner:latest
  runner_labels: self-hosted,linux,x64,docker
  max_runners:   3
  min_idle:      1
  github_poll_interval: 60      # minimum seconds between API scans for each pool
  repo_check_workers: 6         # concurrent GitHub/Docker repository inspections (max 32)
  runner_operation_workers: 4  # concurrent removals and provisions (max 16)
  memory_limit:  10g      # RAM per runner — set to (total LXC RAM - 2g) ÷ max_runners
  cpu_limit:     0       # 0 = no CPU limit (recommended) — runners use whatever is free


pools:

  # ── Example 1: Org-level pool (recommended) ───────────────────────────────
  # One pool that serves ALL repos under "smart".
  # Runners register at org level — any repo's workflow can pick them up.
  # - name:  smart-org
  #   owner: smart
  #   pat:   "${GITHUB_PAT}"          # reads from .env / environment
  #   # repo: ""                      # omit repo = org-level
  #   max_runners: 3
  #   min_idle:    1


  # ── Example 2: Dedicated pool for one repo ────────────────────────────────
  # Useful if a repo needs special labels, more runners, or a different image.
  # Uncomment and adjust:
  #
  - name:  smart
    owner: smart
    repo:  smart
    pat:   "${GITHUB_PAT}"
    max_runners:   10
    min_idle:      2
    runner_labels: self-hosted,linux,x64,docker,prestashop
    runner_image:  gh-runner:latest   # custom image with php, composer etc


  # ── Example 3: Different GitHub account / org ─────────────────────────────
  # Use a separate PAT for a different account.
  # Uncomment and adjust:
  #
  # - name:  client-org
  #   owner: client-github-org
  #   pat:   "${CLIENT_GITHUB_PAT}"   # add CLIENT_GITHUB_PAT to .env
  #   max_runners: 2
  #   min_idle:    0                  # no warm runners for low-volume org


  # ── Example 4: Personal account — all repositories ───────────────────────
  # Repositories are discovered automatically. GitHub still registers each
  # runner at repository level, while max_runners caps the whole account pool.
  # min_idle is intentionally 0 because a warm runner belongs to one repo.
  #
  # - name:  personal
  #   owner: my-github-username
  #   scope: personal
  #   pat:   "${PERSONAL_GITHUB_PAT}"
  #   repo_discovery_ttl: 600          # refresh repository list every 10 minutes
  #   github_poll_interval: 60         # increase for accounts with many repos
  #   repo_check_workers: 6            # inspect repositories concurrently
  #   runner_operation_workers: 4      # remove/provision runners concurrently
  #   max_runners: 10
  #   min_idle:    0
